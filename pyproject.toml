[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraulik"
version = "0.6.0"
description = "Stationäre hydraulisch-thermische Berechnung von HVAC-Hydraulikschaltungen (SIMPLE-Netzwerksolver)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Heschl" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.18"]
# Browsertests der Editoren (tools/e2e/); danach: python -m playwright install chromium
e2e = ["playwright>=1.40"]

[project.scripts]
hydraulik = "hydraulik.cli:main"
editor = "hydraulik.cli:editor_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydraulik = ["editor_template.html", "air_editor_template.html", "yaml_core.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
